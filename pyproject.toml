[project]
name = "moment-quant"
version = "0.1.0"
requires-python = "==3.13.14"
dependencies = [
    "aeon==1.5.0",
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "numba==0.63.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "torch==2.13.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "F", "W", "I"]
ignore = ["E402"]

[tool.black]
line-length = 120
